<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centre Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1960; --ink-soft:#4d4a78; --paper:#e9f3fb; --card:#ffffff; --line:#d3dcec;
    --teal:#1C1960; --teal-dark:#141043;
    --sky:#57B9EA; --sky-dark:#2f9fd6;
    --pass:#2f855a; --improve:#c07d10; --fail:#c0392b;
    --pass-bg:#e8f3ec; --improve-bg:#fbf1dd; --fail-bg:#fbe9e7;
    --shadow:0 1px 2px rgba(28,25,96,.06),0 6px 20px rgba(28,25,96,.08); --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 130px}

  header.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .topbar-inner{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:46px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:28px;height:28px;border-radius:7px;display:block}
  .topscore{font-family:"Poppins",sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em;color:#fff}
  .topscore .lv{color:var(--sky);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}
  .topbar .ctx{margin-left:auto;font-size:12px;color:#b9c2e0;text-align:right;line-height:1.3}
  .topbar .ctx b{color:#fff;font-weight:600;display:block}

  .progress{background:rgba(255,255,255,.15);height:3px;overflow:hidden}
  .bar{height:3px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--sky);width:0;transition:width .35s ease}

  h1.title{font-family:"Poppins",sans-serif;font-size:30px;line-height:1.1;margin:26px 0 6px;font-weight:700}
  .lede{color:var(--ink-soft);margin:0 0 24px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}

  label.fld{display:block;margin-bottom:14px}
  label.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input[type=text],input[type=date],input[type=password],input[type=email],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .readonly-field{background:#efeee8;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink-soft);font-weight:500}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%233b4757' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15);background:#fff}

  .btn{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:11px;padding:13px 20px;font-size:15px;transition:transform .06s ease,background .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-dark)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#efeee8}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn:focus-visible{outline:3px solid rgba(15,118,110,.5);outline-offset:2px}

  .sec-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
  .sec-title{font-family:"Poppins",sans-serif;font-size:23px;font-weight:700;margin:4px 0 2px}
  .sec-count{font-size:13px;color:var(--ink-soft)}

  .item{border-top:1px solid var(--line);padding:18px 0}
  .item:first-of-type{border-top:none}
  .item .q{font-size:16px;font-weight:500;margin-bottom:12px}
  .rate{display:flex;flex-wrap:wrap;gap:8px}
  .rate button{flex:1 1 auto;min-width:62px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:10px;padding:11px 6px;transition:all .12s ease}
  .rate button:hover{border-color:var(--ink-soft)}
  .rate button:focus-visible{outline:3px solid rgba(15,118,110,.5);outline-offset:2px}
  .rate button.on{background:#e4f2fc;border-color:var(--sky-dark);color:var(--teal)}
  .rate button.on[data-r="pass"],.rate button.on[data-r="yes"]{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
  .rate button.on[data-r="improve"]{background:var(--improve-bg);border-color:var(--improve);color:var(--improve)}
  .rate button.on[data-r="fail"],.rate button.on[data-r="no"]{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
  .rate button.on[data-r="na"]{background:#ecebe5;border-color:var(--ink-soft);color:var(--ink)}

  .item-extra{margin-top:12px;display:none}
  .item-extra.show{display:block}
  .note-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .note-row textarea{flex:1;min-width:200px;min-height:44px}
  .photo-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .photo-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .thumb{margin-top:10px;display:inline-block;border-radius:8px;border:1px solid var(--line);max-height:90px}
  .entry{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;margin-bottom:10px}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .entry-label{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .numwrap{display:flex;align-items:center;gap:9px}
  .num-in{max-width:150px}
  .unit{color:var(--ink-soft);font-size:14px}
  .ans-tag{display:inline-block;background:#eef1f0;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--ink-soft);margin-left:4px;white-space:nowrap}
  .mq{border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
  .mq:last-of-type{border-bottom:none;margin-bottom:6px}
  .mqcfg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .mtype{width:auto;flex:0 0 auto;padding:7px 30px 7px 10px;font-size:13px;background-color:#fff}
  .mcfg{width:auto;max-width:90px;padding:7px 10px;font-size:13px}
  .mcfg.wide{max-width:280px;flex:1 1 180px}
  .cfglbl{font-size:12px;color:var(--ink-soft)}
  .mchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .mchk input{width:auto;margin:0}
  .unanswered-card{border-color:var(--fail)}
  .rlist li.unans{color:var(--fail);font-weight:500}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .badge.crit{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail)}
  .badge.repeat{background:#fdecd6;color:#b3600a;border:1px solid #d98a1f}
  .badge.lastvisit{background:#eef1f7;color:var(--ink-soft);border:1px solid var(--line);text-transform:none;font-weight:600}
  .item.is-critical{border-left:3px solid var(--fail);padding-left:12px;margin-left:-3px}
  details.guide{margin:2px 0 12px;font-size:13px}
  details.guide summary{cursor:pointer;color:var(--sky-dark);font-weight:600;list-style:none}
  details.guide summary::-webkit-details-marker{display:none}
  details.guide summary::before{content:"\24D8";margin-right:5px;}
  details.guide > div{margin-top:6px;color:var(--ink-soft);background:#f4f8fd;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .guide .gtext{margin-bottom:6px}
  .guide .dolist,.guide .dontlist{list-style:none;margin:6px 0 0;padding:0}
  .guide .dolist li,.guide .dontlist li{position:relative;padding:3px 0 3px 24px;font-size:13px}
  .guide .dolist li{color:#215c3c}
  .guide .dolist li::before{content:"\2713";position:absolute;left:2px;color:var(--pass);font-weight:700}
  .guide .dontlist li{color:#8a2c22}
  .guide .dontlist li::before{content:"\2717";position:absolute;left:2px;color:var(--fail);font-weight:700}
  .who-in{margin-bottom:8px;font-weight:500}
  .field-error{border-color:var(--fail) !important;background:var(--fail-bg) !important}
  .photo-btn.need{border-color:var(--fail);color:var(--fail)}
  .prevcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--sky);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .prevhead{font-family:"Poppins",sans-serif;font-weight:600;font-size:14px;color:var(--ink)}
  .prevtargets{margin-top:8px;font-size:13px;color:var(--ink-soft)}
  .prevtargets span{font-weight:600;color:var(--ink)}
  .prevtargets pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0}
  .prevflag{margin-top:8px;font-size:12.5px;color:#b3600a;font-weight:600}
  .critbanner{background:var(--fail);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:16px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .critbanner ul{margin:8px 0;padding-left:20px;font-weight:500}
  .repeatbanner{background:#fdecd6;color:#8a4a06;border:1px solid #d98a1f;border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:13.5px;font-weight:600}
  .mguide{margin-top:0;width:100%;font-size:13px;padding:8px 10px}
  .resumecard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--sky-dark);border-left:3px solid var(--sky);border-radius:12px;padding:12px 14px;margin-top:12px}
  .resumebtns{display:flex;gap:8px;flex-shrink:0}
  .sumstat{display:flex;gap:10px;margin-bottom:16px}
  .sumstat > div{flex:1;background:var(--ink);color:#fff;border-radius:12px;padding:14px;text-align:center}
  .sumstat .bignum{display:block;font-family:"Poppins",sans-serif;font-weight:700;font-size:24px}
  .sumstat .statlbl{display:block;font-size:11px;color:#b9c2e0;margin-top:3px;letter-spacing:.02em}
  .sumcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
  .sumcard:hover{border-color:var(--sky-dark)}
  .sumtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .sumname{font-weight:600;font-size:15px}
  .sumscore{font-family:"Poppins",sans-serif;font-weight:700;font-size:18px}
  .summeta{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .sumdelta{font-weight:600}
  .sumdelta.up{color:var(--pass)} .sumdelta.down{color:var(--fail)} .sumdelta.flat{color:var(--ink-soft)}
  .sumtag{display:inline-block;margin-top:8px;background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
  .sumtag.warn{background:#fdecd6;color:#8a4a06;border-color:#d98a1f}
  .sumtags{display:flex;gap:8px;flex-wrap:wrap}
  .sumrow2{display:flex;align-items:center;gap:12px;margin-top:6px}
  .spark{flex:0 0 auto}
  .sortbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .sortbtn{border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:7px 12px;border-radius:20px;cursor:pointer}
  .sortbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* Management area */
  .mgmt-head{display:flex;align-items:center;gap:13px;margin:22px 0 16px}
  .mgmt-logo{width:44px;height:44px;border-radius:10px}
  .mgmt-title{font-family:"Poppins",sans-serif;font-weight:700;font-size:22px;color:var(--ink);line-height:1}
  .mgmt-sub{font-size:13px;color:var(--ink-soft);margin-top:3px}
  .mtabs{display:flex;gap:6px;background:#e0e8f4;border-radius:11px;padding:4px;margin-bottom:16px}
  .mtab{flex:1;border:none;background:transparent;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-soft);padding:9px 6px;border-radius:8px;cursor:pointer}
  .mtab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .mstats{display:flex;gap:18px;margin:2px 0 12px;font-size:13px;color:var(--ink-soft)}
  .mstats b{font-family:"Poppins",sans-serif;color:var(--ink);font-size:16px;margin-right:3px}
  .msec2{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
  .msec2.open{border-color:var(--sky-dark)}
  .msec-sum{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;user-select:none}
  .msec-sum .chev{color:var(--sky-dark);font-size:12px;width:12px}
  .msec-name{flex:1;font-weight:600;font-size:14.5px;color:var(--ink)}
  .msec-badge{background:#e0e8f4;color:var(--ink);font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;min-width:26px;text-align:center}
  .msec-body{padding:4px 15px 16px;border-top:1px solid var(--line)}
  .msec-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .mq{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px;background:#fbfcfe}
  .mq:last-of-type{margin-bottom:6px}
  .qopts{margin-top:8px}
  .qopts > summary{cursor:pointer;font-size:12.5px;color:var(--sky-dark);font-weight:600;list-style:none}
  .qopts > summary::-webkit-details-marker{display:none}
  .qopts > summary::before{content:"\2699 ";}
  .mini-crit{color:var(--fail);font-weight:700}
  .qopts-body{margin-top:10px;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
  .msubcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .msub-h{font-family:"Poppins",sans-serif;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:10px}
  .mbtnrow{display:flex;gap:8px;flex-wrap:wrap}
  .sigpad{width:100%;height:180px;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
  .sig-view{max-height:120px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:4px}
  .tallybar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:16px;position:sticky;top:57px;z-index:15}
  .brandmark{display:flex;align-items:center;gap:13px;margin:26px 0 8px}
  .brandmark-logo{width:52px;height:52px;border-radius:12px;display:block;box-shadow:var(--shadow)}
  .brandmark-name{font-family:"Poppins",sans-serif;font-weight:700;font-size:22px;color:var(--ink);line-height:1}
  .brandmark-sub{font-size:13px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}
  .report-brand{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
  .report-brand img{width:44px;height:44px;border-radius:10px;display:block}
  .rb-name{font-family:"Poppins",sans-serif;font-weight:700;font-size:20px;color:var(--ink);line-height:1}
  .rb-sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .tallytitle{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa6b4}
  .tallyctl{display:flex;align-items:center;gap:8px}
  .tallyctl .tlbl{font-size:12.5px;color:#cdd5df}
  .tallyctl button{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:18px;line-height:1;cursor:pointer;font-weight:600}
  .tallyctl button:hover{background:var(--teal)}
  .tcount{font-family:"Poppins",sans-serif;font-weight:700;font-size:17px;min-width:22px;text-align:center}
  .req{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fail);vertical-align:middle}
  .note-ta.need{border-color:var(--fail);background:var(--fail-bg)}
  .item.need-note{}
  .add-note{background:none;border:1px dashed var(--line);color:var(--ink-soft);width:100%;padding:10px;border-radius:10px;font:inherit;font-weight:500;font-size:13.5px;cursor:pointer}
  .add-note:hover{border-color:var(--teal);color:var(--teal)}
  .rentry{border-left:2px solid var(--line);padding-left:10px;margin-top:8px}
  .thumb-wrap{position:relative;display:inline-block}
  .thumb-x{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}

  .navrow{display:flex;gap:12px;justify-content:space-between;margin-top:8px}
  .footer-actions{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--paper) 70%,rgba(242,241,236,0));padding:14px 18px 20px}
  .footer-inner{max-width:760px;margin:0 auto;display:flex;gap:12px}
  .footer-inner .btn{flex:1}

  .verdict{border-radius:var(--radius);padding:22px;color:#fff;margin-bottom:18px}
  .verdict .big{font-family:"Poppins",sans-serif;font-size:46px;font-weight:700;line-height:1}
  .verdict .word{font-family:"Poppins",sans-serif;font-size:20px;font-weight:600;margin-top:2px}
  .verdict .sub{font-size:13.5px;opacity:.9;margin-top:8px}
  .report-h{font-family:"Poppins",sans-serif;font-size:18px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .report-h .pip{width:11px;height:11px;border-radius:3px;display:inline-block}
  .rlist{list-style:none;padding:0;margin:10px 0 0}
  .rlist li{padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
  .rlist li:first-child{border-top:none}
  .rlist .rnote{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
  .rlist img{max-height:70px;border-radius:6px;border:1px solid var(--line);margin-top:8px;display:block}
  .empty{color:var(--ink-soft);font-size:14px;font-style:italic}

  .history{margin-top:6px}
  .hist-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
  .hist-item:first-child{border-top:none}
  .hist-item:hover .hcentre{color:var(--teal)}
  .hcentre{font-weight:600;font-size:14.5px}
  .hmeta{font-size:12.5px;color:var(--ink-soft)}
  .hscore{font-family:"Poppins",sans-serif;font-weight:700;font-size:15px}

  .textlink{background:none;border:none;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
  .textlink:hover{color:var(--teal)}
  .managebar{display:flex;justify-content:center;margin-top:22px}

  /* Management editor */
  .mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .mrow input{flex:1}
  .reorder{display:flex;flex-direction:column;gap:2px}
  .reorder button{width:26px;height:20px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:11px;line-height:1;color:var(--ink-soft)}
  .reorder button:hover{border-color:var(--teal);color:var(--teal)}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:38px;cursor:pointer;color:var(--fail);font-size:16px}
  .iconbtn:hover{background:var(--fail-bg);border-color:var(--fail)}
  .msec{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:#fbfaf7}
  .msec-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .msec-head input{flex:1;font-weight:600}
  .banner{background:var(--improve-bg);border:1px solid var(--improve);color:#7a5406;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:16px}

  .hidden{display:none !important}

let config = null;      // loaded from storage or defaults

/* ---------- question types ---------- */
function q(text,type,extra){ return Object.assign({text,type:type||"rating"},extra||{}); }
const TYPE_LABELS = { rating:"Pass / Improve / Fail", yesno:"Yes / No", scale:"Scale (1–max)", number:"Number", choice:"Multiple choice" };

// the tappable options for a question (rating/yesno/scale/choice). number is handled separately.
function optionsFor(it){
  const na = it.allowNA ? [["na","N/A"]] : [];
  if(it.type==="yesno") return [["yes","Yes"],["no","No"]].concat(na);
  if(it.type==="scale"){ const max=it.max||5,min=it.min||1,o=[]; for(let n=min;n<=max;n++)o.push([String(n),String(n)]); return o.concat(na); }
  if(it.type==="choice"){ const o=(it.options||[]).map(x=>[x,x]); return o.concat(na); }
  return [["pass","Pass"],["improve","Improve"],["fail","Fail"]].concat(na); // rating
}
// score fraction 0..1, or null if it doesn't count toward the score
function itemScore(it){
  const a=it.answer;
  if(a===null||a===""||a==="na") return null;
  if(it.type==="yesno") return a==="yes"?1:0;
  if(it.type==="scale"){ const min=it.min||1,max=it.max||5,n=Number(a); return isNaN(n)?null:(n-min)/(max-min); }
  if(it.type==="choice"){ if(it.scored&&it.options&&it.options.length){ const i=it.options.indexOf(a); if(i>=0){ const last=it.options.length-1; return last>0?(last-i)/last:1; } } return null; }
  if(it.type==="number") return null; // recorded as observations, not scored
  return a==="pass"?1:(a==="improve"?0.5:0); // rating
}
// which report section an answered item belongs to
function bucketOf(it){
  const a=it.answer;
  if(a===null||a===""||a==="na") return "skip";
  if(it.type==="number"){
    if(it.minBySize){
      const sz=currentSize(), min = sz && it.minBySize[sz], n=Number(a);
      if(min!=null && !isNaN(n) && n < min) return "improve";
    }
    return "obs";
  }
  if(it.type==="choice" && !(it.scored&&it.options)) return "obs";
  const f=itemScore(it);
  if(f===null) return "skip";
  if(f>=0.7) return "well";
  if(f<=0.5) return "improve";
  return "obs"; // middling scale value
}
// human-readable answer for the report
function answerText(it){
  const a=it.answer;
  if(a===null||a==="") return "—";
  if(a==="na") return "N/A";
  if(it.type==="scale") return a+" / "+(it.max||5);
  if(it.type==="number") return a+(it.unit?(" "+it.unit):"");
  if(it.type==="yesno") return a==="yes"?"Yes":"No";
  if(it.type==="rating") return a.charAt(0).toUpperCase()+a.slice(1);
  return a;
}

async function loadConfig(){
  if(storageOK){
    try{
      const r = await window.storage.get("app-config",false);
      if(r){ config = JSON.parse(r.value); 
        // fill any missing keys from defaults
        config.passcode = config.passcode ?? DEFAULT_CONFIG.passcode;
        config.centres  = config.centres  ?? DEFAULT_CONFIG.centres;
        config.template = config.template ?? DEFAULT_CONFIG.template;
        // when I ship an updated built-in checklist, refresh it but keep the
        // user's own centres and passcode
        if(config.checklistVersion !== DEFAULT_CONFIG.checklistVersion){
          config.template = JSON.parse(JSON.stringify(DEFAULT_CONFIG.template));
          config.checklistVersion = DEFAULT_CONFIG.checklistVersion;
          saveConfig();
        }
        if(config.configVersion !== DEFAULT_CONFIG.configVersion){
          config.centres = JSON.parse(JSON.stringify(DEFAULT_CONFIG.centres));
          config.passcode = DEFAULT_CONFIG.passcode;
          config.configVersion = DEFAULT_CONFIG.configVersion;
          saveConfig();
        }
        normalizeTemplate(config);
        return;
      }
    }catch(e){}
  }
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  saveConfig();
}
async function saveConfig(){

  try{ await window.storage.set("app-config", JSON.stringify(config), false); return true; }

}

async function collectInspections(){

async function rebuildIndex(){

    for(const rec of recs){

      await window.storage.set("insp:"+rec.id, JSON.stringify(rec), false);

async function loadPrevForCentre(centre){
  if(!storageOK) return null;

    const r=await window.storage.get("inspections-index",false); if(!r) return null;
    const idx=JSON.parse(r.value).filter(h=>h.centre===centre);
    if(!idx.length) return null;
    idx.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const rec=await window.storage.get("insp:"+idx[0].id,false); if(!rec) return null;
    const prev=JSON.parse(rec.value);
    const flagged=[];
    (prev.sections||[]).forEach(s=>s.items.forEach(it=>{ if(it.rating!==undefined&&it.answer===undefined){it.answer=it.rating;} if((it.answer==="fail"||it.answer==="improve"||it.answer==="no")) flagged.push(it.text); }));
    return { date:prev.meta&&prev.meta.date, score:prev.score, targets:prev.targets||"", flagged };
  }catch(e){ return null; }
}

  }catch(e){ toast("Couldn't open that inspection."); }
}

/* ---------- inspection state ---------- */
function normalizeItem(it){
  if(it.rating!==undefined && it.answer===undefined){ it.answer=it.rating; delete it.rating; }
  if(it.answer===undefined) it.answer=null;
  if(!it.type) it.type="rating";
  if(!it.entries){
    const e={note:it.note||"",photos:it.photo?[it.photo]:[]};
    it.entries=(e.note||e.photos.length)?[e]:[{note:"",photos:[]}];
    delete it.note; delete it.photo;
  }
  return it;
}
function normalizeTemplate(cfg){
  (cfg.template||[]).forEach(s=>{
    s.items=(s.items||[]).map(x=> typeof x==="string" ? {text:x,type:"rating"} : (x.type?x:Object.assign({type:"rating"},x)) );
  });
}
function getEntry(item,ei){ return item.entries[ei]; }
function freshState(){
  return {
    meta:{ centre:(config.centres[0]||""), inspector:"", size:"", date:new Date().toISOString().slice(0,10), start:null, end:null, activeMs:0, segStart:null },
    sections: config.template.map((s,si)=>({
      title:s.title,
      items:s.items.map((it,ii)=>({ id:si+"-"+ii, text:it.text, type:it.type||"rating", options:it.options, min:it.min, max:it.max, unit:it.unit, tally:it.tally, scored:it.scored, requireNote:it.requireNote, critical:it.critical, guide:it.guide, dos:it.dos, donts:it.donts, sizeGuide:it.sizeGuide, minBySize:it.minBySize, whoField:it.whoField, photoExempt:it.photoExempt, allowNA:it.allowNA, answer:null, entries:[{note:"",photos:[]}] }))
    })),
    targets:"", savedId:null, prev:null,
    debrief:{ role:"Head of Centre", name:"", notes:"", feedback:"", email:"", photos:[], signature:null }
  };
}

/* ---------- scoring ---------- */
function computeScore(){
  let scored=0,pts=0,well=0,poor=0,obs=0,unanswered=0;
  state.sections.forEach(s=>s.items.forEach(it=>{
    const f=itemScore(it), b=bucketOf(it);
    if(it.answer===null||it.answer===""){ unanswered++; }
    if(f!==null){ scored++; pts+=f; }
    if(b==="well")well++; else if(b==="improve")poor++; else if(b==="obs")obs++;
  }));
  const pct=scored?Math.round((pts/scored)*100):0;
  return {pct,scored,well,poor,obs,unanswered};
}
function verdictFor(pct){
  if(pct>=85)return{word:"Good",color:"#2f855a"};
  if(pct>=65)return{word:"Satisfactory",color:"#c07d10"};
  return{word:"Needs attention",color:"#c0392b"};
}
function updateLiveScore(){ setTopbar(); }
function setTopbar(){
  const lg=document.getElementById("logo"); if(lg && !lg.src) lg.src=LOGO;
  const el=document.getElementById("topScore"); if(!el) return;
  if((screen==="inspect"||screen==="debrief")&&state){ el.innerHTML='<span class="lv">Live</span>'+computeScore().pct+'%'; }
  else el.textContent="";
}
function fmtTime(iso){ if(!iso)return"—"; const d=new Date(iso); return isNaN(d)?"—":d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function niceDate(iso){ const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function durationText(a,b){ if(!a||!b)return"—"; const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000)); const h=Math.floor(m/60),mm=m%60; return h?(h+"h "+mm+"m"):(mm+"m"); }
// --- Active-time tracking: the clock only runs while an inspection is open, and pauses when you leave it. ---
function timerEligible(){ return !!(state && state.meta && state.meta.start && !state.savedId && !state.meta.end); }
function checkpointTimer(){ if(state&&state.meta&&state.meta.segStart){ const now=Date.now(); state.meta.activeMs=(state.meta.activeMs||0)+(now-state.meta.segStart); state.meta.segStart=now; } }
function pauseTimer(){ if(state&&state.meta&&state.meta.segStart){ state.meta.activeMs=(state.meta.activeMs||0)+(Date.now()-state.meta.segStart); state.meta.segStart=null; } }
function resumeTimer(){ if(timerEligible() && !state.meta.segStart){ state.meta.segStart=Date.now(); } }
function activeDurationMs(){
  if(!state||!state.meta) return 0;
  const m=state.meta;
  if(m.activeMs==null && m.start && m.end) return Math.max(0,new Date(m.end)-new Date(m.start)); // legacy records
  let ms=m.activeMs||0; if(m.segStart) ms+=Date.now()-m.segStart; return ms;
}
function fmtDur(ms){ const mins=Math.max(0,Math.round(ms/60000)); const h=Math.floor(mins/60),mm=mins%60; return h?(h+"h "+mm+"m"):(mm+"m"); }
// only a clean "pass-like" answer may skip a note; everything else must have one
function notesRequired(it){
  const a=it.answer;
  if(a===null||a===""||a==="na") return false;      // unanswered / not-applicable
  if(it.requireNote) return true;                    // always-required questions (positive or negative)
  if(it.type==="rating") return a!=="pass";
  if(it.type==="yesno")  return a!=="yes";
  if(it.type==="scale")  return bucketOf(it)==="improve";
  if(it.type==="choice" && it.scored) return bucketOf(it)==="improve";
  return false;                                     // number / unscored choice: optional
}
function noteMissing(it){ return notesRequired(it) && !(it.entries||[]).some(e=>e.note&&e.note.trim()); }
// a critical item that has been failed / flagged this visit
function criticalFail(it){ return it.critical && bucketOf(it)==="improve"; }
// critical fails must carry a photo as evidence
function photoRequired(it){ return criticalFail(it) && !it.photoExempt; }
function photoMissing(it){ return photoRequired(it) && !(it.entries||[]).some(e=>e.photos&&e.photos.length); }
// was this question flagged (to-improve) at the previous visit to this centre?
function repeatIssue(it){ return state.prev && state.prev.flagged && state.prev.flagged.includes(it.text) && bucketOf(it)==="improve"; }
function tallyItem(kind){ for(const s of state.sections)for(const it of s.items) if(it.tally===kind) return it; return null; }

/* ---------- helpers ---------- */
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";
    el.style.cssText="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:var(--shadow);max-width:90%;text-align:center;transition:opacity .3s";
    document.body.appendChild(el);}
  el.textContent=msg; el.style.opacity="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.style.opacity="0";},2600);
}

/* ================= CENTRE SUMMARY (local) ================= */
function sparkline(scores){
  if(!scores||scores.length<2) return '<svg class="spark" width="84" height="22"></svg>';
  const w=84,h=22,pad=3, n=scores.length;
  const min=Math.min.apply(null,scores), max=Math.max.apply(null,scores), range=(max-min)||1;
  const pts=scores.map((s,i)=>{ const x=pad+i*((w-2*pad)/(n-1)); const y=h-pad-((s-min)/range)*(h-2*pad); return x.toFixed(1)+","+y.toFixed(1); });
  const trend=scores[n-1]-scores[0], col=trend>0?"var(--pass)":(trend<0?"var(--fail)":"var(--ink-soft)");
  const last=pts[pts.length-1].split(",");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${col}"/></svg>`;
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(recs){
  try{
    const head=["Centre","Date","Inspector","Section","Question","Type","Answer","ScoreFraction","Critical","Result","Note"];
    const rows=[head];
    recs.forEach(r=>{ const m=r.meta||{}; (r.sections||[]).forEach(s=>s.items.forEach(it=>{ normalizeItem(it);
      const f=itemScore(it); const note=(it.entries||[]).map(e=>(e.who?e.who+": ":"")+(e.note||"")).map(x=>x.trim()).filter(Boolean).join(" | ");
      rows.push([m.centre||"",m.date||"",m.inspector||"",s.title||"",it.text||"",it.type||"",answerText(it),f==null?"":f.toFixed(2),it.critical?"yes":"",bucketOf(it),note]); })); });
    const csv=rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="gotutors-inspections-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Exported "+(rows.length-1)+" rows to CSV.");
  }catch(e){ toast("CSV export failed."); }
}
async function renderSummary(){
  progress.classList.add("hidden"); footer.classList.remove("hidden");

  footerInner.innerHTML=`<button class="btn btn-primary" id="sumBack" style="width:100%">Back to start</button>`;
  document.getElementById("sumBack").onclick=()=>{ screen="start"; render(); window.scrollTo(0,0); };
  const recs=await collectInspections();
  const today=Date.now();
  const byCentre={};
  recs.forEach(r=>{ const c=(r.meta&&r.meta.centre)||"Unknown"; (byCentre[c]=byCentre[c]||[]).push(r); });
  const rows=Object.keys(byCentre).map(c=>{
    const list=byCentre[c].slice().sort((a,b)=>(((a.meta&&a.meta.date)||"")+(a.id||"")).localeCompare(((b.meta&&b.meta.date)||"")+(b.id||"")));
    const latest=list[list.length-1], prev=list[list.length-2];
    const items=[]; (latest.sections||[]).forEach(s=>s.items.forEach(it=>{ normalizeItem(it); items.push(it); }));
    const dstr=latest.meta&&latest.meta.date;
    const days=dstr?Math.floor((today-new Date(dstr).getTime())/86400000):null;
    return { centre:c, count:list.length, score:latest.score!=null?latest.score:0, date:dstr, id:latest.id,
      delta:(prev&&prev.score!=null&&latest.score!=null)?latest.score-prev.score:null,
      crit:items.filter(criticalFail).length, targets:latest.targets||"",
      scores:list.map(r=>r.score!=null?r.score:0), days, overdue:days!=null&&days>OVERDUE_DAYS,
      flagged:items.filter(it=>bucketOf(it)==="improve").map(it=>it.text) };
  });
  const sorters={ score:(a,b)=>a.score-b.score, overdue:(a,b)=>(b.days||0)-(a.days||0), drop:(a,b)=>(a.delta==null?1:a.delta)-(b.delta==null?1:b.delta), az:(a,b)=>a.centre.localeCompare(b.centre) };
  rows.sort(sorters[summarySort]||sorters.score);
  const notYet=config.centres.filter(c=>!byCentre[c]);
  const avg=rows.length?Math.round(rows.reduce((s,r)=>s+r.score,0)/rows.length):0;
  const overdueN=rows.filter(r=>r.overdue).length;
  const issueMap={}; rows.forEach(r=>r.flagged.forEach(t=>{ issueMap[t]=(issueMap[t]||0)+1; }));
  const common=Object.keys(issueMap).map(t=>({t,n:issueMap[t]})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,8);
  const shortDate=d=>{ const x=new Date(d); return isNaN(x)?(d||""):x.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };
  const deltaHtml=d=>d==null?'<span class="sumdelta flat">— new</span>':(d>0?`<span class="sumdelta up">▲ +${d}</span>`:(d<0?`<span class="sumdelta down">▼ ${d}</span>`:'<span class="sumdelta flat">no change</span>'));
  const sortBtn=(id,label)=>`<button class="sortbtn ${summarySort===id?"on":""}" data-sort="${id}">${label}</button>`;
  const cards=rows.map(r=>`
    <div class="sumcard" data-open="${r.id}">
      <div class="sumtop"><span class="sumname">${esc(r.centre)}</span><span class="sumscore" style="color:${verdictFor(r.score).color}">${r.score}%</span></div>
      <div class="sumrow2">${sparkline(r.scores)}<span class="summeta">${shortDate(r.date)}${r.days!=null?" · "+r.days+"d ago":""} · ${deltaHtml(r.delta)}</span></div>
      ${(r.overdue||r.crit)?`<div class="sumtags">${r.overdue?`<span class="sumtag warn">Overdue · ${r.days}d</span>`:""}${r.crit?`<span class="sumtag">⚠ ${r.crit} critical</span>`:""}</div>`:""}
      ${r.targets?`<details class="guide" style="margin-top:8px"><summary>Open targets from last visit</summary><div style="white-space:pre-wrap">${esc(r.targets)}</div></details>`:""}
    </div>`).join("");
  app.innerHTML=`
    <h1 class="title">Centre summary</h1>
    <p class="lede">From inspections saved on this device.</p>
    ${rows.length?`<div class="sumstat">
      <div><span class="bignum">${avg}%</span><span class="statlbl">average score</span></div>
      <div><span class="bignum">${rows.length}</span><span class="statlbl">inspected</span></div>
      <div><span class="bignum" style="${overdueN?'color:#ffb4a8':''}">${overdueN}</span><span class="statlbl">overdue</span></div>
    </div>`:'<div class="card"><p class="empty">No inspections saved on this device yet.</p></div>'}
    ${overdueN?`<div class="repeatbanner">${overdueN} centre(s) not inspected in over ${OVERDUE_DAYS} days.</div>`:""}
    ${common.length?`<div class="card"><div class="report-h" style="font-size:15px"><span class="pip" style="background:var(--improve)"></span>Common issues across centres</div><ul class="rlist">${common.map(x=>`<li>${esc(x.t)} <span class="ans-tag">${x.n} centres</span></li>`).join("")}</ul></div>`:""}
    ${rows.length?`<div class="sortbar">${sortBtn("score","Worst score")}${sortBtn("overdue","Most overdue")}${sortBtn("drop","Biggest drop")}${sortBtn("az","A–Z")}</div>`:""}
    ${cards}
    ${rows.length?`<button class="btn btn-ghost btn-sm" id="csvBtn" style="width:100%;margin-top:8px">⬇ Export all inspections (CSV)</button>`:""}
    ${notYet.length?`<div class="card" style="margin-top:12px"><div class="report-h" style="font-size:14px">Not yet inspected (${notYet.length})</div><p class="rnote" style="margin-top:6px">${notYet.map(esc).join(" · ")}</p></div>`:""}
  `;
  app.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openSaved(el.getAttribute("data-open")));
  app.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{ summarySort=b.getAttribute("data-sort"); renderSummary(); });
  const csvB=document.getElementById("csvBtn"); if(csvB) csvB.onclick=()=>exportCSV(recs);
}

    <div class="sec-eyebrow">Area ${curSec+1} / ${total}</div>
    <div class="sec-title">${esc(sec.title)}</div>
    <div class="sec-count">${sec.items.length} check${sec.items.length!==1?"s":""}</div>
    <div class="card" style="margin-top:16px">${sec.items.map(renderItem).join("")}</div>
  `;
  bindItems(); bindTallyBar();
  footerInner.innerHTML=`
    <button class="btn btn-ghost" id="backBtn">${curSec===0?"Back to start":"Previous area"}</button>
    <button class="btn btn-primary" id="nextBtn">${curSec===total-1?"Finish — debrief":"Next area"}</button>`;
  document.getElementById("backBtn").onclick=()=>{ if(curSec===0){ pauseTimer(); screen="start"; } else {curSec--;} render(); window.scrollTo(0,0); };
  document.getElementById("nextBtn").onclick=()=>{
    const missing=sec.items.filter(it=>noteMissing(it)||photoMissing(it));
    if(missing.length){ toast("Complete the required note/photo on the highlighted checks."); render(); const el=app.querySelector(".need-note"); if(el)el.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    if(curSec===total-1){
      const g=inspectionGaps();
      if(g.msg){
        if(!confirm(g.msg)){ if(g.firstGap!=null){ curSec=g.firstGap; render(); window.scrollTo(0,0); } return; }
      }
      screen="debrief"; render();
    }
    else { curSec++; render(); }
    window.scrollTo(0,0);
  };
}
function inspectionGaps(){
  const skipped=[], unansCrit=[]; let unans=0, firstGap=null;
  state.sections.forEach((s,si)=>{
    let answered=0, hasGap=false;
    s.items.forEach(it=>{
      if(it.answer===null||it.answer===""){ unans++; hasGap=true; if(it.critical) unansCrit.push(it.text); }
      else answered++;
    });
    if(s.items.length && answered===0) skipped.push(s.title);
    if(hasGap && firstGap===null) firstGap=si;
  });
  if(!skipped.length && !unansCrit.length && !unans) return {msg:null};
  let m="Before you finish, note these gaps:\n";
  if(unansCrit.length) m+="\n• "+unansCrit.length+" CRITICAL item(s) not answered:\n   – "+unansCrit.slice(0,5).join("\n   – ")+(unansCrit.length>5?"\n   – …":"");
  if(skipped.length) m+="\n• Section(s) not started: "+skipped.join(", ");
  if(unans) m+="\n• "+unans+" question(s) unanswered in total";
  m+="\n\nOK = finish anyway.\nCancel = go back and complete them.";
  return {msg:m, firstGap};
}

function currentSize(){ return (state&&state.meta&&state.meta.size)||""; }
function sizeLabel(sz){ return ({small:"Small (\u2264 50)",medium:"Medium (50\u2013150)",large:"Large (150+)"})[sz]||""; }
// Resolve a question's Guidelines: size-aware text + do / don't lists.
function resolveGuide(it){
  let text = it.guide||"";
  if(it.sizeGuide){
    const sz=currentSize();
    const chosen = sz && it.sizeGuide[sz] && it.sizeGuide[sz].text;
    if(chosen){ text = chosen + (it.guide?("\n"+it.guide):""); }
    else{
      const all=["small","medium","large"].map(k=>it.sizeGuide[k]&&it.sizeGuide[k].text).filter(Boolean);
      if(all.length) text = all.join("\n") + (it.guide?("\n"+it.guide):"");
    }
  }
  return { text, dos: it.dos||[], donts: it.donts||[] };
}
function renderItem(it){
  normalizeItem(it);
  let answerControl;
  if(it.type==="number"){
    answerControl=`<div class="numwrap"><input type="number" inputmode="numeric" class="num-in" data-id="${it.id}" placeholder="0" value="${it.answer!=null&&it.answer!==""?esc(String(it.answer)):""}">${it.unit?`<span class="unit">${esc(it.unit)}</span>`:""}</div>`;
  }else{
    const opts=optionsFor(it);
    answerControl=`<div class="rate" style="--cols:${opts.length}">`+opts.map(([v,l])=>`<button data-r="${v}" data-id="${it.id}" class="${it.answer===v?"on":""}">${esc(l)}</button>`).join("")+`</div>`;
  }
  const used=it.entries.some(e=>e.note||e.photos.length);
  const answered=(it.answer!==null&&it.answer!=="");
  const showExtra=(answered||used||it.type==="number")?"show":"";
  const needNote=noteMissing(it);
  const needPhoto=photoMissing(it);
  const isRepeat=repeatIssue(it);

  const g=resolveGuide(it);

    ${g.donts.length?`<ul class="dontlist">${g.donts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  </div></details>`:"";
  const entriesHtml=it.entries.map((e,ei)=>`
    <div class="entry">
      ${multi?`<div class="entry-head"><span class="entry-label">Note ${ei+1}</span><button class="textlink" data-delentry="${it.id}" data-ei="${ei}">Remove</button></div>`:""}
      ${it.whoField?`<input type="text" class="who-in" data-item="${it.id}" data-ei="${ei}" placeholder="Teacher's name" value="${esc(e.who||"")}">`:""}
      <div class="note-row">
        <textarea class="note-ta ${(needNote&&ei===0)?"need":""}" data-item="${it.id}" data-ei="${ei}" placeholder="${(needNote&&ei===0)?"Note required — explain what you found":"Note (optional)"}">${esc(e.note)}</textarea>
        <label class="btn btn-ghost photo-btn ${(needPhoto&&ei===0)?"need":""}">📷 ${(needPhoto&&ei===0)?"Photo required":"Add photo"}<input type="file" accept="image/*" capture="environment" class="photo-in" data-item="${it.id}" data-ei="${ei}"></label>
      </div>
      ${e.photos.length?`<div class="thumbs">${e.photos.map((p,pi)=>`<div class="thumb-wrap"><img class="thumb" src="${p}"><button class="thumb-x" data-delphoto="${it.id}" data-ei="${ei}" data-pi="${pi}">×</button></div>`).join("")}</div>`:""}
    </div>`).join("");
  return `
    <div class="item ${needNote||needPhoto?"need-note":""} ${it.critical?"is-critical":""}">
      <div class="q">${esc(it.text)}${badges}${needNote?'<span class="req">note required</span>':""}${needPhoto?'<span class="req">photo required</span>':""}</div>
      ${guideHtml}
      ${answerControl}
      <div class="item-extra ${showExtra}">
        ${entriesHtml}
        <button class="add-note" data-addentry="${it.id}">+ Add another note</button>
      </div>
    </div>`;
}
function findItem(id){for(const s of state.sections){const it=s.items.find(x=>x.id===id);if(it)return it;}return null;}
function compressImage(file, maxDim, quality){
  maxDim=maxDim||1400; quality=quality||0.72;
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ let w=img.width,h=img.height;
        if(Math.max(w,h)>maxDim){ const r=maxDim/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
        try{ const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); resolve(c.toDataURL("image/jpeg",quality)); }
        catch(e){ resolve(rd.result); } };
      img.onerror=()=>resolve(rd.result); img.src=rd.result; };
    rd.onerror=reject; rd.readAsDataURL(file);
  });
}
function bindItems(){

    if(+t.getAttribute("data-ei")===0) t.classList.toggle("need",need);
    saveDraftSoon();
  });
  app.querySelectorAll(".who-in").forEach(inp=>inp.oninput=()=>{ getEntry(findItem(inp.getAttribute("data-item")),+inp.getAttribute("data-ei")).who=inp.value; saveDraftSoon(); });
  app.querySelectorAll(".photo-in").forEach(inp=>inp.onchange=function(){
    const f=this.files[0]; if(!f)return;

  app.querySelectorAll("[data-delphoto]").forEach(x=>x.onclick=()=>{

  app.querySelectorAll("[data-delentry]").forEach(b=>b.onclick=()=>{

    if(!it.entries.length) it.entries.push({note:"",photos:[]}); render();
  });
}

function initSignaturePad(canvas, d){
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1C1960";
  if(d.signature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=d.signature; }
  let drawing=false;
  const pos=e=>{ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)}; };
  const start=e=>{ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const move=e=>{ if(!drawing)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const end=()=>{ if(!drawing)return; drawing=false; d.signature=canvas.toDataURL("image/png"); };
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
}

  `;
  document.getElementById("targets").oninput=e=>{state.targets=e.target.value;};
  document.getElementById("amendBtn").onclick=()=>{ screen="inspect"; curSec=0; render(); window.scrollTo(0,0); };
  const emailOK=d.email && /.+@.+\..+/.test(d.email);
  footerInner.innerHTML=`
    <button class="btn btn-ghost" id="editBtn">Back to debrief</button>
    <button class="btn btn-ghost" id="saveBtn">Save</button>
    <button class="btn btn-primary" id="pdfBtn">${emailOK?"Save PDF & email":"Save / print PDF"}</button>`;
  document.getElementById("editBtn").onclick=()=>{screen="debrief";render();window.scrollTo(0,0);};
  document.getElementById("saveBtn").onclick=saveInspection;
  document.getElementById("pdfBtn").onclick=()=>{
    if(emailOK) openReportEmail();
    setTimeout(()=>window.print(), emailOK?400:0);
  };
  const nb=document.createElement("button");
  nb.className="btn btn-ghost no-print"; nb.textContent="Start a new inspection"; nb.style.cssText="width:100%;margin-top:6px";
  nb.onclick=()=>{ if(confirm("Start a new inspection? Make sure you've saved or exported this one.")){ clearDraft(); state=null; screen="start"; render(); window.scrollTo(0,0); } };
  app.appendChild(nb);
}
function openReportEmail(){
  const d=state.debrief||{}, sc=computeScore(), v=verdictFor(sc.pct);
  const improves=[]; state.sections.forEach(s=>s.items.forEach(it=>{ if(bucketOf(it)==="improve") improves.push(it.text); }));
  const L=[];
  L.push("Hi "+(d.name||"there")+",","");
  L.push("Please find the inspection summary for "+state.meta.centre+" on "+state.meta.date+(state.meta.inspector?" (inspector: "+state.meta.inspector+")":"")+".","");
  L.push("Overall result: "+sc.pct+"% — "+v.word,"");
  if(improves.length){ L.push("Areas to improve:"); improves.slice(0,10).forEach(t=>L.push("• "+t)); if(improves.length>10)L.push("• …and "+(improves.length-10)+" more (see attached)"); L.push(""); }
  if(state.targets){ L.push("Targets before next inspection:",state.targets,""); }
  if(d.notes){ L.push("Discussed & agreed on site:",d.notes,""); }
  if(d.feedback){ L.push("Your feedback:",d.feedback,""); }
  L.push("The full report, with photos and sign-off, is attached as a PDF.","","Thank you.");
  const subject="Inspection report — "+state.meta.centre+" — "+state.meta.date;
  const href="mailto:"+encodeURIComponent(d.email)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(L.join("\n"));
  const a=document.createElement("a"); a.href=href; a.style.display="none"; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= MANAGEMENT ================= */
function openManageGate(){
  const code=prompt("Management passcode:");
  if(code===null) return;
  if(code===config.passcode){ manageTab="checklist"; openSec=-1; screen="manage"; render(); window.scrollTo(0,0); }
  else toast("Incorrect passcode.");
}
function renderManage(){
  progress.classList.add("hidden"); footer.classList.remove("hidden");
  const nSec=config.template.length;
  const nQ=config.template.reduce((s,x)=>s+(x.items?x.items.length:0),0);
  const nCrit=config.template.reduce((s,x)=>s+(x.items?x.items.filter(i=>i.critical).length:0),0);
  const tab=(id,label)=>`<button class="mtab ${manageTab===id?"on":""}" data-tab="${id}">${label}</button>`;
  let panel="";
  if(manageTab==="checklist"){
    panel=`<div class="mstats"><span><b>${nSec}</b> sections</span><span><b>${nQ}</b> checks</span><span><b>${nCrit}</b> critical</span></div>
      <p class="rnote" style="margin:0 0 12px">Tap a section to open it. Changes save automatically.</p>
      <div id="secList"></div>
      <button class="btn btn-primary btn-sm" id="addSection" style="width:100%;margin-top:8px">+ Add a section</button>`;
  } else if(manageTab==="centres"){
    panel=`<div class="mstats"><span><b>${config.centres.length}</b> centres</span></div>
      <div id="centreList"></div>
      <div class="mrow" style="margin-top:14px"><input type="text" id="newCentre" placeholder="Add a centre name"><button class="btn btn-primary btn-sm" id="addCentre">Add</button></div>`;
  } else {
    panel=`
      <div class="msubcard"><div class="msub-h">Management passcode</div>
        <input type="text" id="passField" value="${esc(config.passcode)}">
        <p class="rnote" style="margin:8px 0 0">A soft lock — it stops casual access, not a determined one. Real admin-only access comes with the hosted version.</p></div>
      <div class="msubcard"><div class="msub-h">Backup &amp; data</div>
        <p class="rnote" style="margin:0 0 12px">Export a backup to keep in the cloud (Drive, OneDrive, email). Import restores it — and moves inspections between devices.</p>
        <div class="mbtnrow">
          <button class="btn btn-ghost btn-sm" id="exportInsp">Export backup</button>
          <label class="btn btn-ghost btn-sm photo-btn">Import backup<input type="file" accept="application/json,.json" id="importInsp"></label>
          <button class="btn btn-ghost btn-sm" id="clearInsp" style="color:var(--fail);border-color:var(--fail)">Clear all</button>
        </div></div>`;
  }
  app.innerHTML=`
    <div class="mgmt-head">
      <img class="mgmt-logo" src="${LOGO}" alt="">
      <div><div class="mgmt-title">Management</div><div class="mgmt-sub">Configure checklist, centres and data</div></div>
    </div>
    <div class="mtabs">${tab("checklist","Checklist")}${tab("centres","Centres")}${tab("data","Data &amp; Access")}</div>
    <div class="mpanel">${panel}</div>
  `;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ manageTab=b.getAttribute("data-tab"); renderManage(); window.scrollTo(0,0); });
  if(manageTab==="checklist"){
    renderSecList();
    document.getElementById("addSection").onclick=()=>{ config.template.push({title:"New section",items:[q("New question")]}); openSec=config.template.length-1; saveConfig(); renderManage(); };
  } else if(manageTab==="centres"){
    renderCentreList();
    document.getElementById("addCentre").onclick=()=>{ const v=document.getElementById("newCentre").value.trim(); if(!v)return; config.centres.push(v); saveConfig(); renderManage(); };
  } else {
    document.getElementById("passField").oninput=e=>{ config.passcode=e.target.value||"manage"; saveConfig(); };
    document.getElementById("clearInsp").onclick=async()=>{ if(confirm("Delete ALL saved inspections on this device? This cannot be undone.")){ await clearAllInspections(); renderManage(); } };
    document.getElementById("exportInsp").onclick=exportAllData;
    document.getElementById("importInsp").onchange=async function(){ const f=this.files[0]; if(!f)return; if(confirm("Import inspections from this backup? They'll be added to what's already saved here.")){ await importBackup(f); } this.value=""; renderManage(); };
  }
  footerInner.innerHTML=`<button class="btn btn-primary" id="doneBtn" style="width:100%">Done</button>`;
  document.getElementById("doneBtn").onclick=()=>{ saveConfig(); manageTab="checklist"; openSec=-1; screen="start"; render(); window.scrollTo(0,0); };
}
function renderCentreList(){
  const el=document.getElementById("centreList");
  if(!el) return;
  el.innerHTML=config.centres.map((c,i)=>`
    <div class="mrow">
      <div class="reorder"><button data-cu="${i}" ${i===0?"disabled style='opacity:.3'":""}>▲</button><button data-cd="${i}" ${i===config.centres.length-1?"disabled style='opacity:.3'":""}>▼</button></div>
      <input type="text" data-ce="${i}" value="${esc(c)}">
      <button class="iconbtn" data-cx="${i}" title="Remove">🗑</button>
    </div>`).join("") || '<p class="empty">No centres yet.</p>';
  el.querySelectorAll("[data-ce]").forEach(inp=>inp.oninput=()=>{config.centres[+inp.getAttribute("data-ce")]=inp.value;saveConfig();});
  el.querySelectorAll("[data-cx]").forEach(b=>b.onclick=()=>{config.centres.splice(+b.getAttribute("data-cx"),1);saveConfig();renderCentreList();});
  el.querySelectorAll("[data-cu]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-cu");[config.centres[i-1],config.centres[i]]=[config.centres[i],config.centres[i-1]];saveConfig();renderCentreList();});
  el.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-cd");[config.centres[i+1],config.centres[i]]=[config.centres[i],config.centres[i+1]];saveConfig();renderCentreList();});
}
function renderSecList(){
  const el=document.getElementById("secList");
  if(!el) return;
  const typeSel=(it,si,qi)=>`<select class="mtype" data-qt="${si}.${qi}">${Object.keys(TYPE_LABELS).map(k=>`<option value="${k}" ${((it.type||"rating")===k)?"selected":""}>${TYPE_LABELS[k]}</option>`).join("")}</select>`;
  const typeCfg=(it,si,qi)=>{
    if(it.type==="scale") return `<input type="number" class="mcfg" data-qmax="${si}.${qi}" value="${it.max||5}" min="2" max="10" title="Top of scale"><span class="cfglbl">max (1–this)</span>`;
    if(it.type==="number") return `<input type="text" class="mcfg wide" data-qunit="${si}.${qi}" value="${esc(it.unit||"")}" placeholder="unit, e.g. times (optional)">`;
    if(it.type==="choice") return `<input type="text" class="mcfg wide" data-qopts="${si}.${qi}" value="${esc((it.options||[]).join(", "))}" placeholder="Options, comma separated"><label class="mchk"><input type="checkbox" data-qscored="${si}.${qi}" ${it.scored?"checked":""}> score it (1st = best)</label>`;
    return "";
  };
  el.innerHTML=config.template.map((s,si)=>{
    const open=si===openSec;
    const qhtml = open ? (s.items.map((it,qi)=>`
        <div class="mq">
          <div class="mrow">
            <div class="reorder"><button data-qu="${si}.${qi}" ${qi===0?"disabled style='opacity:.3'":""}>▲</button><button data-qd="${si}.${qi}" ${qi===s.items.length-1?"disabled style='opacity:.3'":""}>▼</button></div>
            <input type="text" data-qe="${si}.${qi}" value="${esc(it.text)}">
            <button class="iconbtn" data-qx="${si}.${qi}" title="Remove question">🗑</button>
          </div>
          <div class="mqcfg">${typeSel(it,si,qi)}${typeCfg(it,si,qi)}</div>
          <details class="qopts">
            <summary>More options${it.critical?' &middot; <span class="mini-crit">critical</span>':""}</summary>
            <div class="qopts-body">
              <label class="mchk"><input type="checkbox" data-qcrit="${si}.${qi}" ${it.critical?"checked":""}> critical (must pass)</label>
              <label class="mchk"><input type="checkbox" data-qnote="${si}.${qi}" ${it.requireNote?"checked":""}> note always required</label>
              <label class="mchk"><input type="checkbox" data-qna="${si}.${qi}" ${it.allowNA?"checked":""}> allow N/A</label>
              <input type="text" class="mguide" data-qguide="${si}.${qi}" value="${esc(it.guide||"")}" placeholder="Guidelines note (optional)">
            </div>
          </details>
        </div>`).join("")) + `<button class="btn btn-ghost btn-sm" data-qadd="${si}" style="margin-top:6px">+ Add question</button>` : "";
    const body = open ? `<div class="msec-body">
        <div class="msec-tools">
          <button class="btn btn-ghost btn-sm" data-su="${si}" ${si===0?"disabled":""}>↑ Up</button>
          <button class="btn btn-ghost btn-sm" data-sd="${si}" ${si===config.template.length-1?"disabled":""}>↓ Down</button>
          <button class="btn btn-ghost btn-sm" data-sx="${si}" style="color:var(--fail);border-color:var(--fail)">Delete section</button>
        </div>
        <label class="fld" style="margin:2px 0 14px"><span>Section name</span><input type="text" data-se="${si}" value="${esc(s.title)}"></label>
        ${qhtml}
      </div>` : "";
    return `<div class="msec2 ${open?"open":""}">
      <div class="msec-sum" data-toggle="${si}"><span class="chev">${open?"▾":"▸"}</span><span class="msec-name">${esc(s.title||"Untitled section")}</span><span class="msec-badge">${s.items.length}</span></div>
      ${body}
    </div>`;
  }).join("") || '<p class="empty">No sections yet.</p>';

  const P=a=>a.split(".").map(Number);
  el.querySelectorAll("[data-toggle]").forEach(h=>h.onclick=()=>{ const i=+h.getAttribute("data-toggle"); openSec=(openSec===i?-1:i); renderSecList(); });
  el.querySelectorAll("[data-se]").forEach(inp=>inp.oninput=()=>{config.template[+inp.getAttribute("data-se")].title=inp.value; const nm=inp.closest(".msec2").querySelector(".msec-name"); if(nm)nm.textContent=inp.value||"Untitled section"; saveConfig();});
  el.querySelectorAll("[data-sx]").forEach(b=>b.onclick=()=>{if(confirm("Delete this whole section?")){const i=+b.getAttribute("data-sx");config.template.splice(i,1);if(openSec===i)openSec=-1;else if(openSec>i)openSec--;saveConfig();renderManage();}});
  el.querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-su");[config.template[i-1],config.template[i]]=[config.template[i],config.template[i-1]];openSec=i-1;saveConfig();renderManage();});
  el.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-sd");[config.template[i+1],config.template[i]]=[config.template[i],config.template[i+1]];openSec=i+1;saveConfig();renderManage();});
  el.querySelectorAll("[data-qe]").forEach(inp=>{const[s,q]=P(inp.getAttribute("data-qe"));inp.oninput=()=>{config.template[s].items[q].text=inp.value;saveConfig();};});
  el.querySelectorAll("[data-qx]").forEach(b=>{const[s,q]=P(b.getAttribute("data-qx"));b.onclick=()=>{config.template[s].items.splice(q,1);saveConfig();renderManage();};});
  el.querySelectorAll("[data-qu]").forEach(b=>{const[s,q]=P(b.getAttribute("data-qu"));b.onclick=()=>{[config.template[s].items[q-1],config.template[s].items[q]]=[config.template[s].items[q],config.template[s].items[q-1]];saveConfig();renderSecList();};});
  el.querySelectorAll("[data-qd]").forEach(b=>{const[s,q]=P(b.getAttribute("data-qd"));b.onclick=()=>{[config.template[s].items[q+1],config.template[s].items[q]]=[config.template[s].items[q],config.template[s].items[q+1]];saveConfig();renderSecList();};});
  el.querySelectorAll("[data-qt]").forEach(sel=>{const[s,q]=P(sel.getAttribute("data-qt"));sel.onchange=()=>{const it=config.template[s].items[q];it.type=sel.value;if(it.type==="scale"&&!it.max)it.max=5;if(it.type==="choice"&&!it.options)it.options=["Option 1","Option 2"];saveConfig();renderSecList();};});
  el.querySelectorAll("[data-qmax]").forEach(inp=>{const[s,q]=P(inp.getAttribute("data-qmax"));inp.oninput=()=>{config.template[s].items[q].max=Math.max(2,Math.min(10,+inp.value||5));saveConfig();};});
  el.querySelectorAll("[data-qunit]").forEach(inp=>{const[s,q]=P(inp.getAttribute("data-qunit"));inp.oninput=()=>{config.template[s].items[q].unit=inp.value;saveConfig();};});
  el.querySelectorAll("[data-qopts]").forEach(inp=>{const[s,q]=P(inp.getAttribute("data-qopts"));inp.oninput=()=>{config.template[s].items[q].options=inp.value.split(",").map(x=>x.trim()).filter(Boolean);saveConfig();};});
  el.querySelectorAll("[data-qscored]").forEach(cb=>{const[s,q]=P(cb.getAttribute("data-qscored"));cb.onchange=()=>{config.template[s].items[q].scored=cb.checked;saveConfig();};});
  el.querySelectorAll("[data-qnote]").forEach(cb=>{const[s,q]=P(cb.getAttribute("data-qnote"));cb.onchange=()=>{config.template[s].items[q].requireNote=cb.checked;saveConfig();};});
  el.querySelectorAll("[data-qcrit]").forEach(cb=>{const[s,q]=P(cb.getAttribute("data-qcrit"));cb.onchange=()=>{config.template[s].items[q].critical=cb.checked;saveConfig();};});
  el.querySelectorAll("[data-qna]").forEach(cb=>{const[s,q]=P(cb.getAttribute("data-qna"));cb.onchange=()=>{config.template[s].items[q].allowNA=cb.checked;saveConfig();};});
  el.querySelectorAll("[data-qguide]").forEach(inp=>{const[s,q]=P(inp.getAttribute("data-qguide"));inp.oninput=()=>{config.template[s].items[q].guide=inp.value;saveConfig();};});
  el.querySelectorAll("[data-qadd]").forEach(b=>b.onclick=()=>{config.template[+b.getAttribute("data-qadd")].items.push(q("New question"));saveConfig();renderSecList();});
}

/* ---------- boot ---------- */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(screen==="inspect"||screen==="debrief"){ pauseTimer(); saveDraft(); } }
  else { if(screen==="inspect"||screen==="debrief") resumeTimer(); }
});
window.addEventListener("pagehide",()=>{ if(screen==="inspect"||screen==="debrief"){ pauseTimer(); saveDraft(); } });
(async function(){ await loadConfig(); pendingDraft=await loadDraft(); render(); })();
</script>
